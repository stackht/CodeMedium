# Render Blueprint — Code Medium backend (Express + Prisma)
# Deploy: Render Dashboard -> New -> Blueprint -> select this GitHub repo.
# Fill the secret env values (marked sync:false) when prompted, before first deploy.

services:
  - type: web
    name: codemedium-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_COOLDOWN_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
